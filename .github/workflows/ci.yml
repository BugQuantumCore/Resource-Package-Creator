name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Run tests
        run: cargo test --workspace
      - name: Check audio feature
        run: cargo check -p mrpc-app --features audio

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mtr-resource-package-creator-linux-x64
          - os: windows-latest
            artifact: mtr-resource-package-creator-windows-x64
          - os: macos-latest
            artifact: mtr-resource-package-creator-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release binary (with audio)
        run: cargo build -p mrpc-app --release --features audio
      - name: Generate demo artifacts
        run: cargo run -p mrpc-core --example gen_demo -- ./out
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/release/mtr-resource-package-creator
          if [[ "$RUNNER_OS" == "Windows" ]]; then BIN="$BIN.exe"; fi
          cp "$BIN" dist/
          cp out/mrpc-demo-pack.zip out/vvvf-demo.wav dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

  build-linux-noaudio:
    name: Build (Linux, no audio deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary (no audio feature)
        run: cargo build -p mrpc-app --release
      - uses: actions/upload-artifact@v4
        with:
          name: mtr-resource-package-creator-linux-x64-noaudio
          path: target/release/mtr-resource-package-creator
