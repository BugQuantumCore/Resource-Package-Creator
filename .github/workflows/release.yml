name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mtr-resource-package-creator-linux-x64
            binary: mtr-resource-package-creator
          - os: windows-latest
            artifact: mtr-resource-package-creator-windows-x64
            binary: mtr-resource-package-creator.exe
          - os: macos-latest
            artifact: mtr-resource-package-creator-macos-arm64
            binary: mtr-resource-package-creator
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build release binary (with audio)
        run: cargo build -p mrpc-app --release --features audio
      - name: Generate demo artifacts
        run: cargo run -p mrpc-core --example gen_demo -- ./out
      - name: Workspace version
        shell: bash
        run: echo "VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"

      # ----------------------------------------------------------- portable zip
      - name: Package portable archive
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/
          cp out/mrpc-demo-pack.zip out/vvvf-demo.wav dist/ 2>/dev/null || true
          cd dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "../${{ matrix.artifact }}-${VER}.zip" .
          else
            zip -r "../${{ matrix.artifact }}-${VER}.zip" .
          fi
          mv "../${{ matrix.artifact }}-${VER}.zip" .
          cd ..
          ls -la dist

      # ------------------------------------------------------------------- MSI
      - name: Install WiX 3 (full toolset incl. WixUIExtension)
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install wixtoolset --allow-downgrade -y --no-progress

      - name: Build MSI installer (WiX 3)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sed -i "s/ Version=\"[0-9.]*\"/ Version=\"$VER\"/" packaging/wix/main.wxs
          grep -o 'Version="[0-9.]*"' packaging/wix/main.wxs | head -1
          WIXBIN=$(ls -d "/c/Program Files (x86)/WiX Toolset v3."*/bin | head -n 1)
          echo "WiX bin: $WIXBIN"
          "$WIXBIN/candle.exe" -arch x64 -o target/wix/main.wixobj packaging/wix/main.wxs
          "$WIXBIN/light.exe" -ext WixUIExtension -sice:ICE61 -o target/wix/app.msi target/wix/main.wixobj
          cp target/wix/app.msi "dist/mtr-resource-package-creator-$VER-x64.msi"
          ls -la dist

      # ------------------------------------------------------------ deb / rpm
      - name: Build .deb (cargo-deb)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p mrpc-app --no-build
          cp target/debian/*.deb dist/
          ls -la dist

      - name: Build .rpm (cargo-generate-rpm)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm -p mrpc-app
          cp target/generate-rpm/*.rpm dist/
          ls -la dist

      # ------------------------------------------------------------------- dmg
      - name: Build .app bundle and .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/MTR Resource Package Creator.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/release/${{ matrix.binary }}" "$APP/Contents/MacOS/"
          sed "s/__VERSION__/$VER/" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp packaging/icons/icon.icns "$APP/Contents/Resources/icon.icns"
          codesign --force --deep --sign - --timestamp=none "$APP"
          mkdir -p dmgroot
          cp -R "$APP" dmgroot/
          hdiutil create -volname "MTR Resource Package Creator" -srcfolder dmgroot -ov -format UDZO "dist/mtr-resource-package-creator-$VER-macos-arm64.dmg"
          rm -rf dmgroot
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.VER }}
          path: dist

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f | sort
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*/*.zip
            artifacts/*/*.msi
            artifacts/*/*.deb
            artifacts/*/*.rpm
            artifacts/*/*.dmg
